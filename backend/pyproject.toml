[project]
name = "signalproof-backend"
version = "0.1.0"
description = "Deterministic BTC/ETH/SOL signal engine with an immutable, verifiable track record"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "httpx>=0.27",
  "websockets>=12.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "bcrypt>=4.1",
  "pyjwt>=2.8",
  "python-multipart>=0.0.9",
  "orjson>=3.10",
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.4", "httpx>=0.27", "freezegun>=1.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
