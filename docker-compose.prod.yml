# Production: nothing but Caddy (80/443) is reachable from outside.
# usage: docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: signalproof
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: signalproof
    volumes: ["dbdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalproof"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    env_file: [.env]
    environment: {SP_ROLE: api}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: >
      sh -c "python -m app.db_bootstrap &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips='*'"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/v1/status',timeout=3)\""]
      interval: 15s
      retries: 5

  ingest:
    build: ./backend
    restart: unless-stopped
    env_file: [.env]
    environment: {SP_ROLE: ingest}
    depends_on: {api: {condition: service_healthy}}
    command: ["python", "-m", "app.workers.ingest"]

  engine:
    build: ./backend
    restart: unless-stopped
    env_file: [.env]
    environment: {SP_ROLE: engine}
    depends_on: {api: {condition: service_healthy}}
    command: ["python", "-m", "app.workers.engine_worker"]
    deploy: {replicas: 1}   # never more than one: it owns the ledger head

  lifecycle:
    build: ./backend
    restart: unless-stopped
    env_file: [.env]
    environment: {SP_ROLE: lifecycle}
    depends_on: {api: {condition: service_healthy}}
    command: ["python", "-m", "app.workers.lifecycle_worker"]

  anchor:
    build: ./backend
    restart: unless-stopped
    env_file: [.env]
    environment: {SP_ROLE: anchor}
    depends_on: {api: {condition: service_healthy}}
    command: ["python", "-m", "app.workers.anchor_worker"]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN:?set DOMAIN in .env}
        NEXT_PUBLIC_WS_URL: wss://${DOMAIN}/ws/market
    restart: unless-stopped
    depends_on: [api]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: {DOMAIN: "${DOMAIN}"}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [web, api]

volumes:
  dbdata:
  redisdata:
  caddydata:
  caddyconfig:
